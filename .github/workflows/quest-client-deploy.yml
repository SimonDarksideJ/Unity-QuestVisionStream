# QuestVisionStream WebXR — build the IWSDK client and deploy it to Cloudflare Pages.
#
# Adapted from the "Pale Signal" reference workflow. The client lives in
# V2/quest-client (a static Vite/IWSDK bundle).
#
# ─── THINGS YOU MAY WANT TO CHANGE ──────────────────────────────────────────────
#   • HOME BRANCH (the feature's home; production on push, staging base on PR):
#       currently  IWSDK
#       appears in 3 places → on.pull_request.branches, on.push.branches, and the
#       PROD_BRANCH env of deploy-production. Change all three together.
#   • CLOUDFLARE PAGES PROJECTS:
#       production → `questvisionstream`       (apex questvisionstream.pages.dev)
#       staging    → `questvisionstream-test`  (apex questvisionstream-test.pages.dev)
#   • SHORT-LINK ALIASES (is.gd, best-effort): `questvisionstream` (prod) /
#     `questvisionstreamtest` (staging). If unavailable, the summary just shows the
#     apex URL + QR (which always work).
#   • SIGNALING SERVER the deployed app connects to: set a Cloudflare Pages env var
#     `QVS_SIGNALING_URL` per project (Settings → Variables and Secrets), editable
#     ONLINE with no rebuild — served to the app by functions/api/config.js. The
#     app also honours a `?server=wss://HOST:3000` URL override.
#
# Two ISOLATED Cloudflare Pages projects keep PR validation off the live site:
#   - production → questvisionstream       — ONLY on push to the home branch
#                  (a merged PR) or manual workflow_dispatch.
#   - staging    → questvisionstream-test  — ONLY on pull_request. A PR can NEVER
#                  deploy to `questvisionstream`, so it can't overwrite the live site.
#
# Deploy needs these repo secrets (deploy steps skip automatically when absent,
# e.g. on fork PRs — see Documentation/Deployment-Cloudflare-Pages.md to create them):
#   - CLOUDFLARE_API_TOKEN   (token with "Cloudflare Pages: Edit" permission)
#   - CLOUDFLARE_ACCOUNT_ID  (your Cloudflare account id)

name: QuestVisionStream WebXR Deploy

on:
  pull_request:
    branches: [IWSDK]
    # Build/deploy only when the CLIENT changes — not docs or editor config.
    paths:
      - "V2/quest-client/**"
      - "!V2/quest-client/*.md"
      - "!V2/quest-client/**/*.md"
      - "!V2/quest-client/.vscode/**"
      - ".github/workflows/quest-client-deploy.yml"
  push:
    branches: [IWSDK]
    paths:
      - "V2/quest-client/**"
      - "!V2/quest-client/*.md"
      - "!V2/quest-client/**/*.md"
      - "!V2/quest-client/.vscode/**"
      - ".github/workflows/quest-client-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: V2/quest-client

jobs:
  # ---------------------------------------------------------------------------
  # Build + gate (typecheck). Runs for every trigger; produces the dist artifact
  # the deploy jobs consume. The client bundles the file-linked libraries
  # (service-framework, com.questvisionstream) from source via Vite aliases, so a
  # full repo checkout is all that's needed.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: V2/quest-client/package-lock.json

      - name: Install library dependencies (file-linked)
        # `npm ci` in quest-client does NOT install the file-linked library's
        # own node_modules; the typecheck/build compile the library from
        # source and need @realitycollective/service-framework resolvable from
        # the library directory. Same order as the V2 monorepo's install:all.
        working-directory: V2/com.questvisionstream
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (static Vite bundle → dist/)
        run: npx vite build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: quest-client-dist
          path: V2/quest-client/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # PRODUCTION — push to the home branch (a merged PR) or manual dispatch.
  # Publishes to project `questvisionstream` (the live apex). Never runs on PRs.
  # ---------------------------------------------------------------------------
  deploy-production:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Surfaced here so steps can gate on it (secrets can't be used directly in
      # step `if:` conditions, but `env` can).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: quest-client-dist
          path: V2/quest-client/dist

      - name: Ensure the Cloudflare Pages project + production branch
        # Create the project if missing, otherwise pin its production branch to the
        # home branch — via the Cloudflare API (idempotent).
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: questvisionstream
          PROD_BRANCH: IWSDK
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${PROJECT}")"
          if [ "$code" = "200" ]; then
            echo "Project ${PROJECT} exists — pinning production branch to ${PROD_BRANCH}"
            resp="$(curl -fsS -X PATCH "${api}/${PROJECT}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
              --data "{\"production_branch\":\"${PROD_BRANCH}\"}")"
          elif [ "$code" = "404" ]; then
            echo "Project ${PROJECT} missing — creating with production branch ${PROD_BRANCH}"
            resp="$(curl -fsS -X POST "${api}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
              --data "{\"name\":\"${PROJECT}\",\"production_branch\":\"${PROD_BRANCH}\"}")"
          else
            echo "::error::Unexpected HTTP ${code} querying the Pages project."
            exit 1
          fi
          if [ "$(printf '%s' "$resp" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare API call failed."
            printf '%s\n' "$resp" | jq . 2>/dev/null || printf '%s\n' "$resp"
            exit 1
          fi
          echo "Production branch is now: $(printf '%s' "$resp" | jq -r '.result.production_branch')"

      - name: Deploy to Cloudflare Pages (production)
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        # NOTE: the /api/config Pages Function is NOT part of the dist artifact —
        # wrangler discovers `functions/` relative to workingDirectory (from this
        # job's checkout). Keep workingDirectory pointing at V2/quest-client or
        # the Function silently disappears and the app falls back to localhost.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: V2/quest-client
          command: >-
            pages deploy dist
            --project-name=questvisionstream
            --branch=${{ github.ref_name }}
            --commit-dirty=true

      - name: Publish short code + QR for the Quest
        # Short link via da.gd (5-char domain → genuinely short, e.g. da.gd/qvs
        # = 9 chars). is.gd/v.gd REJECT *.pages.dev ("database insert failed");
        # tinyurl works but its domain alone is 12 chars, longer than the apex.
        # da.gd isn't idempotent and codes can be squatted, so on "already taken"
        # we reuse the alias ONLY if it still resolves to our apex; else fall back.
        if: steps.deploy.outcome == 'success'
        env:
          APEX_URL: https://questvisionstream.pages.dev
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: qvs
        run: |
          set +e
          APEX="${APEX_URL}"
          disp() { local u="$1"; u="${u#https://}"; printf '%s' "${u#http://}"; }
          ok_short() { case "$1" in https://da.gd/*|https://tinyurl.com/*) printf '%s' "$1"; return 0;; esac; return 1; }
          APEX_HOST="$(disp "$APEX")"; APEX_HOST="${APEX_HOST%%/*}"
          enc="$(jq -rn --arg u "$APEX" '$u|@uri' 2>/dev/null)"
          SHORT=""
          # 1) da.gd custom short alias (da.gd/${ALIAS}); reuse if already ours.
          r="$(curl -sS --max-time 8 "https://da.gd/s?url=${enc}&shorturl=${ALIAS}" 2>&1 | head -1)"; echo "[shortcode] da.gd '${ALIAS}': ${r}"; SHORT="$(ok_short "$r")"
          if [ -z "$SHORT" ]; then
            final="$(curl -sSL -o /dev/null -w '%{url_effective}' --max-time 8 "https://da.gd/${ALIAS}" 2>/dev/null)"
            echo "[shortcode] existing da.gd/${ALIAS} -> ${final}"
            case "$final" in *"${APEX_HOST}"*) SHORT="https://da.gd/${ALIAS}"; echo "[shortcode] reusing (points at our apex)";; esac
          fi
          # 2) Fallbacks: da.gd auto (short+stable) → tinyurl auto.
          if [ -z "$SHORT" ]; then r="$(curl -sS --max-time 8 "https://da.gd/s?url=${enc}" 2>&1 | head -1)"; echo "[shortcode] da.gd auto: ${r}"; SHORT="$(ok_short "$r")"; fi
          if [ -z "$SHORT" ]; then r="$(curl -sS --max-time 8 "https://tinyurl.com/api-create.php?url=${enc}" 2>&1)"; echo "[shortcode] tinyurl auto: ${r}"; SHORT="$(ok_short "$r")"; fi
          [ -z "$SHORT" ] && echo "::notice title=Short link::No shortener available — the apex URL + QR still work."
          {
            echo "## QuestVisionStream WebXR — PRODUCTION"
            echo ""
            echo "The app reads its streaming server from Cloudflare (KV \`QVS_CONFIG\` / \`signaling_url\`, else the \`QVS_SIGNALING_URL\` env var). Per-open override: append \`?server=wss://HOST:3000\`."
            echo ""
            echo "![QR code](https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=10&data=${enc})"
            echo ""
            echo "---"
            echo ""
            # Big, headset-readable block LAST; lead with the SHORT link (fewest
            # chars to type). H1 + inline code = the largest text summaries render,
            # and the link is tappable if you open this page in the Quest browser.
            echo "# 📺 Open on your Quest"
            echo ""
            if [ -n "$SHORT" ]; then
              echo "# [\`$(disp "$SHORT")\`](${SHORT})"
              echo ""
              echo "### …or the full URL"
              echo ""
              echo "# [\`$(disp "$APEX")\`](${APEX})"
            else
              echo "# [\`$(disp "$APEX")\`](${APEX})"
            fi
            [ -n "${DEPLOY_URL}" ] && { echo ""; echo "<sub>This exact build: [$(disp "${DEPLOY_URL}")](${DEPLOY_URL})</sub>"; }
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # STAGING — pull_request only. Publishes to the ISOLATED `questvisionstream-test`
  # project (apex questvisionstream-test.pages.dev), plus a best-effort smoke check.
  # Cannot touch `questvisionstream`.
  # ---------------------------------------------------------------------------
  deploy-staging:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v7
        with:
          name: quest-client-dist
          path: V2/quest-client/dist

      - name: Ensure the staging Pages project (questvisionstream-test)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: questvisionstream-test
          PROD_BRANCH: staging
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/${PROJECT}")"
          if [ "$code" = "200" ]; then
            echo "Project ${PROJECT} exists — pinning production branch to ${PROD_BRANCH}"
            resp="$(curl -fsS -X PATCH "${api}/${PROJECT}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
              --data "{\"production_branch\":\"${PROD_BRANCH}\"}")"
          elif [ "$code" = "404" ]; then
            echo "Project ${PROJECT} missing — creating with production branch ${PROD_BRANCH}"
            resp="$(curl -fsS -X POST "${api}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json" \
              --data "{\"name\":\"${PROJECT}\",\"production_branch\":\"${PROD_BRANCH}\"}")"
          else
            echo "::error::Unexpected HTTP ${code} querying the staging Pages project."
            exit 1
          fi
          if [ "$(printf '%s' "$resp" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare API call failed."
            printf '%s\n' "$resp" | jq . 2>/dev/null || printf '%s\n' "$resp"
            exit 1
          fi
          echo "Staging production branch is now: $(printf '%s' "$resp" | jq -r '.result.production_branch')"

      - name: Deploy to Cloudflare Pages (staging)
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        # NOTE: `functions/api/config.js` deploys implicitly from this checkout's
        # workingDirectory, not from the dist artifact — see the production job's
        # note. The smoke check below verifies it actually made it.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: V2/quest-client
          # --branch=staging == the staging project's production branch, so it
          # lands on the stable apex questvisionstream-test.pages.dev.
          command: >-
            pages deploy dist
            --project-name=questvisionstream-test
            --branch=staging
            --commit-dirty=true

      - name: Smoke check
        # Best-effort: confirm the staging deploy serves index.html. A brand-new
        # Pages project needs a few seconds for TLS/DNS, so we retry — and only WARN
        # on failure (the deploy itself is the deliverable; we must not red the PR
        # over propagation lag). Do NOT enable `-e` — a transient curl error must
        # not abort the step.
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -u
          echo "Smoke-testing ${DEPLOY_URL}"
          page="000"
          for i in 1 2 3 4 5 6; do
            page="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${DEPLOY_URL}/" || echo "000")"
            [ "$page" = "200" ] && break
            echo "  attempt ${i}: index HTTP ${page} — waiting for propagation…"
            sleep 5
          done
          echo "  index.html -> HTTP ${page}"
          if [ "$page" = "200" ]; then
            echo "✅ staging deploy healthy"
          else
            echo "::warning title=Staging smoke check::index=${page} (expected 200). Likely first-deploy TLS/propagation lag — the deploy itself succeeded; re-run or check ${DEPLOY_URL} directly."
          fi
          # The Pages Function rides along implicitly (see the deploy step note) —
          # verify /api/config actually deployed and returns its JSON shape.
          config_body="$(curl -s --max-time 20 "${DEPLOY_URL}/api/config" || echo "")"
          echo "  /api/config -> ${config_body}"
          case "$config_body" in
            *'"server"'*) echo "✅ /api/config Function deployed" ;;
            *) echo "::warning title=Staging smoke check::/api/config did not return the expected JSON — the Pages Function may not have deployed (check workingDirectory/functions/)." ;;
          esac

      - name: Publish staging short code + QR
        if: steps.deploy.outcome == 'success'
        env:
          APEX_URL: https://questvisionstream-test.pages.dev
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: qvs-t
        run: |
          # Short link via da.gd (see prod step for why). Reuse the alias only if
          # it still resolves to our apex — da.gd codes can be squatted.
          set +e
          APEX="${APEX_URL}"
          disp() { local u="$1"; u="${u#https://}"; printf '%s' "${u#http://}"; }
          ok_short() { case "$1" in https://da.gd/*|https://tinyurl.com/*) printf '%s' "$1"; return 0;; esac; return 1; }
          APEX_HOST="$(disp "$APEX")"; APEX_HOST="${APEX_HOST%%/*}"
          enc="$(jq -rn --arg u "$APEX" '$u|@uri' 2>/dev/null)"
          SHORT=""
          r="$(curl -sS --max-time 8 "https://da.gd/s?url=${enc}&shorturl=${ALIAS}" 2>&1 | head -1)"; echo "[shortcode] da.gd '${ALIAS}': ${r}"; SHORT="$(ok_short "$r")"
          if [ -z "$SHORT" ]; then
            final="$(curl -sSL -o /dev/null -w '%{url_effective}' --max-time 8 "https://da.gd/${ALIAS}" 2>/dev/null)"
            echo "[shortcode] existing da.gd/${ALIAS} -> ${final}"
            case "$final" in *"${APEX_HOST}"*) SHORT="https://da.gd/${ALIAS}"; echo "[shortcode] reusing (points at our apex)";; esac
          fi
          if [ -z "$SHORT" ]; then r="$(curl -sS --max-time 8 "https://da.gd/s?url=${enc}" 2>&1 | head -1)"; echo "[shortcode] da.gd auto: ${r}"; SHORT="$(ok_short "$r")"; fi
          if [ -z "$SHORT" ]; then r="$(curl -sS --max-time 8 "https://tinyurl.com/api-create.php?url=${enc}" 2>&1)"; echo "[shortcode] tinyurl auto: ${r}"; SHORT="$(ok_short "$r")"; fi
          [ -z "$SHORT" ] && echo "::notice title=Short link::No shortener available — the apex URL + QR still work."
          {
            echo "## QuestVisionStream WebXR — STAGING (questvisionstream-test)"
            echo ""
            echo "> This PR deployed to the **isolated** \`questvisionstream-test\` project. The"
            echo "> live site \`questvisionstream.pages.dev\` was **not** touched."
            echo ""
            echo "Signaling: KV \`QVS_CONFIG\`/\`signaling_url\` on \`questvisionstream-test\`, else \`QVS_SIGNALING_URL\`; per-open override \`?server=wss://HOST:3000\`."
            echo ""
            echo "![QR code](https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=10&data=${enc})"
            echo ""
            echo "---"
            echo ""
            echo "# 🧪 Open on your Quest (staging)"
            echo ""
            if [ -n "$SHORT" ]; then
              echo "# [\`$(disp "$SHORT")\`](${SHORT})"
              echo ""
              echo "### …or the full URL"
              echo ""
              echo "# [\`$(disp "$APEX")\`](${APEX})"
            else
              echo "# [\`$(disp "$APEX")\`](${APEX})"
            fi
            [ -n "${DEPLOY_URL}" ] && { echo ""; echo "<sub>This exact build: [$(disp "${DEPLOY_URL}")](${DEPLOY_URL})</sub>"; }
          } >> "$GITHUB_STEP_SUMMARY"
