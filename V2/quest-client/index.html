<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuestVisionStream — WebXR Client</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101014;
        font-family: sans-serif;
        color: #e0e0e0;
      }
      #scene-container {
        width: 100vw;
        height: 100vh;
      }
      #hint {
        position: fixed;
        top: 12px;
        left: 12px;
        font-size: 13px;
        opacity: 0.7;
        pointer-events: none;
      }
      #status {
        position: fixed;
        bottom: 12px;
        left: 12px;
        font-size: 13px;
        font-family: monospace;
        white-space: pre-line;
        opacity: 0.85;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="hint">
      QuestVisionStream WebXR — enter AR to stream passthrough for detection.
      Set the server with <code>?server=wss://HOST:3000</code>
      (plain <code>ws://</code> only works from an <code>http://localhost</code> dev page —
      hosted HTTPS pages require <code>wss://</code>).
    </div>
    <div id="status"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
