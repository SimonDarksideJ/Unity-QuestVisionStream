<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ethar Training Demonstration</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(120% 120% at 50% 0%, #1a1d26 0%, #0a0b0f 70%);
        font-family: 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #e8ecf4;
      }
      #scene-container {
        width: 100vw;
        height: 100vh;
      }

      /* Flat-browser intro — the 2D page is a welcome screen, not the client. */
      #intro {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        z-index: 40;
      }
      #intro.hidden {
        display: none;
      }
      .intro-card {
        background: #000;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        padding: 48px 56px 44px;
        max-width: 620px;
        text-align: center;
      }
      .intro-title {
        margin: 0;
        font-size: clamp(28px, 5vw, 46px);
        font-weight: 800;
        letter-spacing: 0.2px;
        line-height: 1.15;
        color: #ffffff;
      }
      .intro-sub {
        margin: 16px 0 28px;
        font-size: clamp(14px, 2.2vw, 17px);
        font-weight: 500;
        opacity: 0.7;
      }
      #enter-xr {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        font-size: clamp(16px, 2.4vw, 19px);
        color: #06222b;
        background: linear-gradient(180deg, #46e0c8 0%, #23c3a8 100%);
        padding: 16px 40px;
        border-radius: 999px;
        box-shadow: 0 10px 28px rgba(35, 195, 168, 0.35);
        transition:
          transform 0.08s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease;
      }
      #enter-xr:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 34px rgba(35, 195, 168, 0.45);
      }
      #enter-xr:active {
        transform: translateY(0);
      }
      #enter-xr:disabled {
        cursor: default;
        opacity: 0.5;
        background: #2a2e38;
        color: #aeb6c4;
        box-shadow: none;
      }
      .intro-note {
        margin-top: 18px;
        min-height: 18px;
        font-size: 13px;
        font-weight: 500;
        opacity: 0.6;
      }
      .intro-note.error {
        color: #ff6b6b;
        font-weight: 600;
        opacity: 0.95;
      }

      #status {
        position: fixed;
        bottom: 12px;
        right: 12px;
        font-size: 12px;
        font-family: ui-monospace, monospace;
        white-space: pre-line;
        opacity: 0.75;
        text-align: right;
        pointer-events: none;
        z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>

    <div id="intro">
      <div class="intro-card">
        <h1 class="intro-title">Welcome to the Ethar Training Demonstration</h1>
        <p class="intro-sub">Put on your headset and step into the experience.</p>
        <button id="enter-xr" type="button" disabled>Checking XR…</button>
        <div class="intro-note" id="intro-note"></div>
      </div>
    </div>

    <div id="status"></div>

    <!--
      Vendored js-aruco2 (MIT) — classic scripts that self-register a global `AR`
      and the AprilTag 36h11 dictionary. Loaded in dependency order BEFORE the
      module script (which is deferred), so window.AR is ready when the AprilTag
      detection service starts. See src/apriltags/detector.ts.
    -->
    <script src="/vendor/js-aruco2/cv.js"></script>
    <script src="/vendor/js-aruco2/aruco.js"></script>
    <script src="/vendor/js-aruco2/dictionaries/apriltag_36h11.js"></script>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
